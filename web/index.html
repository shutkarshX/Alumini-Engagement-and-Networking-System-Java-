<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AlumniOS — Alumni Information Platform</title>
<style>
:root{--navy:#142344;--blue:#4965e8;--ink:#1b2540;--muted:#77839b;--line:#e5eaf2;--bg:#f5f7fb;--white:#fff;--green:#15866b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}.layout{display:grid;grid-template-columns:235px 1fr;min-height:100vh}.side{background:var(--navy);color:white;padding:24px 15px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:10px;padding:0 8px 28px}.logo{background:linear-gradient(135deg,#8da5ff,#5de2d0);color:#142344;border-radius:12px;padding:8px 12px;font-weight:900;font-size:18px}.brand b{font-size:16px}.brand small{display:block;color:#9eafd0;font-size:11px}.label{font-size:10px;letter-spacing:1.4px;color:#8f9fbe;padding:0 12px;margin:5px 0 9px}.nav{display:grid;gap:5px}.nav button{background:transparent;color:#b9c5df;text-align:left;padding:12px;border-radius:10px;font-weight:650}.nav button.active,.nav button:hover{background:#ffffff18;color:white}.nav span{display:inline-block;width:27px}.sidefoot{margin-top:auto;padding:18px 10px 0;border-top:1px solid #ffffff22;color:#aab8d3;font-size:11px}.main{min-width:0}.top{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;z-index:2}.muted{color:var(--muted)}.top b{color:var(--ink)}.badge{background:#e9f8f1;color:#15765d;border-radius:30px;padding:6px 10px;font-size:11px;font-weight:800}.content{padding:30px;max-width:1450px;margin:auto}.welcome,.sectionhead{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:22px}.eyebrow{color:var(--blue);font-size:10px;font-weight:850;letter-spacing:1.4px}.welcome h1,.sectionhead h1{margin:6px 0;font-size:27px;letter-spacing:-.7px}.welcome p,.sectionhead p{margin:0;color:var(--muted)}.btn{padding:10px 14px;border-radius:10px;font-weight:750}.primary{background:var(--blue);color:white}.secondary{background:white;border:1px solid var(--line);color:#3c4a68}.actions{display:flex;gap:9px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}.stat,.card{background:white;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 25px #1b2d4c08}.stat{padding:18px}.stathead{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.ico{width:34px;height:34px;display:grid;place-items:center;background:#eef1ff;color:var(--blue);border-radius:10px}.num{font-size:29px;font-weight:850;letter-spacing:-1px;margin:9px 0 0}.card{padding:20px;min-width:0}.cardhead{display:flex;justify-content:space-between;gap:10px;margin-bottom:18px}.card h2{font-size:15px;margin:0}.sub{color:var(--muted);font-size:11px;margin-top:4px}.link{color:var(--blue);background:transparent;font-size:12px;font-weight:800}.grid{display:grid;grid-template-columns:1.3fr 1fr;gap:17px;margin-bottom:17px}.bars{height:220px;display:flex;align-items:end;gap:18px;padding:12px 8px 0;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0,transparent 52px,#eef1f7 53px)}.barcol{flex:1;display:flex;align-items:center;justify-content:end;flex-direction:column;gap:7px;height:100%;min-width:0}.bar{width:min(40px,75%);background:linear-gradient(#7b91ff,#4965e8);border-radius:7px 7px 2px 2px;min-height:5px}.barcol small{font-size:10px;color:var(--muted)}.barcol b{font-size:10px}.activity{display:grid;gap:15px}.activityrow{display:flex;align-items:center;gap:11px}.avatar{width:34px;height:34px;border-radius:50%;background:#e2e9ff;color:#304a9d;display:grid;place-items:center;font-size:11px;font-weight:850;flex-shrink:0}.activityrow b{display:block;font-size:12px}.activityrow small{font-size:11px;color:var(--muted)}.activityrow .right{margin-left:auto;font-size:10px;color:var(--muted)}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:17px}.event{display:flex;align-items:center;gap:12px;margin-bottom:14px}.date{width:44px;border:1px solid var(--line);border-radius:9px;text-align:center;overflow:hidden}.date span{display:block;background:#eef1ff;color:var(--blue);font-size:9px;font-weight:800}.date b{font-size:17px}.eventinfo{flex:1}.eventinfo b{display:block;font-size:12px}.eventinfo small{color:var(--muted);font-size:11px}.tag{background:#e9f8f1;color:#15765d;padding:4px 8px;border-radius:20px;font-size:10px;font-weight:800;white-space:nowrap}.tag.blue{background:#edf0ff;color:#435bd1}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.field{padding:10px 12px;border:1px solid #dce3ee;border-radius:9px;background:white;outline:none;color:var(--ink)}.field:focus{border-color:#7e91f4;box-shadow:0 0 0 3px #4965e817}.search{flex:1;min-width:190px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}.table{border-collapse:collapse;width:100%;white-space:nowrap}.table th{text-align:left;background:#f8faff;color:#78839a;text-transform:uppercase;font-size:10px;letter-spacing:.6px;padding:13px}.table td{padding:12px 13px;border-top:1px solid #edf0f5;font-size:12px}.table tr:hover td{background:#fafbff}.person{display:flex;align-items:center;gap:9px}.person b{display:block}.person small{display:block;color:var(--muted)}.status{background:#e8f8ef;color:#177653;border-radius:20px;padding:4px 8px;font-size:10px;font-weight:800}.pending{background:#fff4db;color:#986600}.mini{background:#f0f3f9;color:#445271;border-radius:7px;padding:6px 9px;margin-right:4px}.notice{padding:12px;border:1px solid #dce5ff;background:#f4f7ff;color:#56647e;border-radius:10px;font-size:11px;margin-top:15px}.featuregrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.feature{background:white;border:1px solid var(--line);border-radius:14px;padding:18px}.feature h3{font-size:13px;margin:13px 0 5px}.feature p{font-size:12px;color:var(--muted)}.meter{height:7px;background:#edf0f7;border-radius:20px;overflow:hidden;margin-top:9px}.meter span{display:block;background:var(--blue);height:100%}.modalback{position:fixed;inset:0;background:#111b33a8;z-index:5;display:grid;place-items:center;padding:18px}.modal{background:white;padding:24px;border-radius:17px;width:min(570px,100%);max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modalhead h2{margin:0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.fg{display:grid;gap:5px}.fg label{font-size:11px;font-weight:750;color:#596781}.fg input,.fg select{width:100%}.full{grid-column:1/-1}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.toast{position:fixed;right:20px;bottom:20px;background:var(--navy);color:white;padding:13px 17px;border-radius:10px;z-index:8}.empty{text-align:center;color:var(--muted);padding:25px}.foot{text-align:center;color:#9ba5b7;font-size:10px;margin:28px 0 0}
@media(max-width:980px){.layout{grid-template-columns:72px 1fr}.side{padding:20px 8px}.brand b,.brand small,.label,.nav .txt,.sidefoot{display:none}.brand{justify-content:center;padding:0 0 22px}.nav button{text-align:center;padding:12px 4px}.nav span{width:auto;display:block;margin:auto auto 4px}.content{padding:22px 18px}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
@media(max-width:620px){.layout{display:block}.side{position:sticky;top:0;z-index:3;padding:7px}.brand{display:none}.nav{display:flex;justify-content:space-around;gap:2px}.nav button{font-size:9px;padding:8px 4px}.nav span{font-size:14px}.nav .txt{display:block}.top{height:54px;padding:0 14px}.top .badge{display:none}.content{padding:18px 12px}.welcome{display:block}.welcome h1,.sectionhead h1{font-size:23px}.welcome .actions{margin-top:13px}.stats{gap:8px}.stat{padding:13px}.num{font-size:24px}.bottom,.featuregrid{grid-template-columns:1fr}.sectionhead{flex-direction:column}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.card{padding:15px}.bars{gap:8px}}
</style></head><body><div class="layout">
<aside class="side"><div class="brand"><div class="logo">A</div><div><b>AlumniOS</b><small>Information Platform</small></div></div><div class="label">WORKSPACE</div><nav class="nav" id="nav">
<button class="active" data-page="dashboard"><span>◫</span><i class="txt">Dashboard</i></button><button data-page="directory"><span>♙</span><i class="txt">Directory</i></button><button data-page="events"><span>▦</span><i class="txt">Events</i></button><button data-page="mentorship"><span>✦</span><i class="txt">Mentorship</i></button><button data-page="analytics"><span>▥</span><i class="txt">Analytics</i></button></nav><div class="sidefoot">QUALITY EDUCATION · SDG 4<br><br>Phase 1 · Browser demo</div></aside>
<main class="main"><header class="top"><div class="muted">Workspace / <b id="crumb">Dashboard</b></div><div style="display:flex;gap:12px;align-items:center"><span class="badge">● Demo workspace</span><button class="btn secondary" onclick="exportCSV()">⇩ Export</button><div class="avatar">UG</div></div></header><div class="content" id="content"></div></main></div><div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const KEY="aluminos.adc.phase1";
const seed=[{id:1,name:"Aarav Sharma",email:"aarav@example.com",batch:"2018",branch:"CSE",company:"Microsoft",role:"Software Engineer",city:"Noida",status:"Verified",interest:"Mentorship"},{id:2,name:"Diya Patel",email:"diya@example.com",batch:"2019",branch:"CSE (DS)",company:"Adobe",role:"Data Analyst",city:"Delhi",status:"Verified",interest:"Networking"},{id:3,name:"Ishaan Verma",email:"ishaan@example.com",batch:"2020",branch:"ECE",company:"Samsung",role:"Systems Engineer",city:"Bengaluru",status:"Pending",interest:"Mentorship"},{id:4,name:"Kavya Singh",email:"kavya@example.com",batch:"2021",branch:"IT",company:"Infosys",role:"Product Analyst",city:"Noida",status:"Verified",interest:"Hiring"},{id:5,name:"Arjun Mehta",email:"arjun@example.com",batch:"2022",branch:"CSE",company:"Paytm",role:"Backend Developer",city:"Gurugram",status:"Verified",interest:"Networking"},{id:6,name:"Ananya Rao",email:"ananya@example.com",batch:"2023",branch:"CSE (DS)",company:"Deloitte",role:"Business Analyst",city:"Hyderabad",status:"Pending",interest:"Mentorship"},{id:7,name:"Rohan Gupta",email:"rohan@example.com",batch:"2024",branch:"ME",company:"Tata Motors",role:"Design Engineer",city:"Pune",status:"Verified",interest:"Hiring"},{id:8,name:"Meera Joshi",email:"meera@example.com",batch:"2025",branch:"CSE",company:"Startup",role:"Founder",city:"Noida",status:"Verified",interest:"Networking"}];
const eventSeed=[{id:101,title:"Alumni Connect Evening",date:"2026-11-14",type:"Networking",location:"NIET Campus",attendees:86,status:"Open"},{id:102,title:"Careers in Data & AI",date:"2026-11-21",type:"Webinar",location:"Online",attendees:124,status:"Open"},{id:103,title:"Mentor Office Hours",date:"2026-12-02",type:"Mentorship",location:"Online",attendees:32,status:"Planning"}];
let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch{}if(!db||!Array.isArray(db.alumni))db={alumni:seed,events:eventSeed,requests:[]};if(!db.events)db.events=eventSeed;if(!db.requests)db.requests=[];
let page="dashboard",filters={q:"",branch:"All",batch:"All",status:"All"};
const $=id=>document.getElementById(id);function save(){localStorage.setItem(KEY,JSON.stringify(db))}function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function ini(n){return n.split(/\s+/).map(x=>x[0]).slice(0,2).join("").toUpperCase()}function toast(s){$("toastRoot").innerHTML='<div class="toast">'+esc(s)+'</div>';setTimeout(()=>$("toastRoot").innerHTML="",2500)}
function go(p){page=p;document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===p));$("crumb").textContent=({dashboard:"Dashboard",directory:"Alumni Directory",events:"Events & Networking",mentorship:"Mentorship",analytics:"Analytics"})[p];render()}$("nav").addEventListener("click",e=>{let b=e.target.closest("[data-page]");if(b)go(b.dataset.page)});
function stat(label,num,ico,foot){return '<div class="stat"><div class="stathead">'+label+'<span class="ico">'+ico+'</span></div><div class="num">'+num+'</div><div class="sub">'+foot+'</div></div>'}
function card(title,sub,body,action){return '<section class="card"><div class="cardhead"><div><h2>'+title+'</h2><div class="sub">'+sub+'</div></div>'+(action||"")+'</div>'+body+'</section>'}
function dashboard(){let a=db.alumni,ys=[2019,2020,2021,2022,2023,2024,2025],cnt=ys.map(y=>a.filter(x=>+x.batch===y).length),mx=Math.max(1,...cnt),bars=ys.map((y,i)=>'<div class="barcol"><b>'+cnt[i]+'</b><div class="bar" style="height:'+Math.max(5,cnt[i]/mx*145)+'px"></div><small>'+y+'</small></div>').join("");let acts=a.slice(-4).reverse().map(x=>'<div class="activityrow"><div class="avatar">'+ini(x.name)+'</div><div><b>'+esc(x.name)+'</b><small>'+esc(x.role)+' · '+esc(x.company)+'</small></div><span class="right">'+x.status+'</span></div>').join("");let ev=db.events.slice().sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3).map(e=>{let d=new Date(e.date+"T12:00:00");return '<div class="event"><div class="date"><span>'+d.toLocaleString("en",{month:"short"}).toUpperCase()+'</span><b>'+d.getDate()+'</b></div><div class="eventinfo"><b>'+esc(e.title)+'</b><small>'+esc(e.type)+' · '+esc(e.location)+'</small></div><span class="tag">'+e.attendees+' going</span></div>'}).join("");return '<div class="welcome"><div><div class="eyebrow">ALUMNI COMMUNITY / OVERVIEW</div><h1>Good morning, Yugansh ✦</h1><p>Your alumni community at a glance. Build connections that last.</p></div><div class="actions"><button class="btn secondary" onclick="exportCSV()">⇩ Export</button><button class="btn primary" onclick="openAlumni()">＋ Add alumni</button></div></div><div class="stats">'+stat("Total alumni",a.length,"♙","Directory records")+stat("Verified profiles",a.filter(x=>x.status==="Verified").length,"✓","Profiles marked verified")+stat("Community events",db.events.length,"▦","Saved event records")+stat("Mentorship interest",a.filter(x=>x.interest==="Mentorship").length,"✦","Profiles open to mentoring")+'</div><div class="grid">'+card("Community by graduation batch","Profile counts across recent batches",'<div class="bars">'+bars+'</div><div class="sub">Counts are calculated from the local demonstration directory.</div>','<button class="link" onclick="go(\\'analytics\\')">Analytics ↗</button>')+card("Directory activity","Latest profile records",'<div class="activity">'+acts+'</div>','<button class="link" onclick="go(\\'directory\\')">Open directory ↗</button>')+'</div><div class="bottom">'+card("Upcoming community events","Networking, careers and mentorship",ev||'<div class="empty">No events added.</div>','<button class="link" onclick="go(\\'events\\')">All events ↗</button>')+card("A connected alumni community","A practical foundation for alumni engagement",'<div class="featuregrid" style="grid-template-columns:1fr 1fr"><div><div class="ico">⌕</div><h3>Find people</h3><p>Search by batch, branch, company or role.</p></div><div><div class="ico">✦</div><h3>Build connections</h3><p>Track mentorship interest and community events.</p></div></div><div class="notice">Phase 1 stores demo records in this browser only. This is not connected to a shared database or institutional system.</div>')+'</div><div class="foot">AlumniOS · Alumni Information Management Platform · Phase 1</div>'}
function filtered(){return db.alumni.filter(a=>(!filters.q||[a.name,a.email,a.company,a.role,a.id].some(v=>String(v).toLowerCase().includes(filters.q.toLowerCase())))&&(filters.branch==="All"||a.branch===filters.branch)&&(filters.batch==="All"||a.batch===filters.batch)&&(filters.status==="All"||a.status===filters.status))}
function directory(){let a=filtered(),branches=["All",...new Set(db.alumni.map(x=>x.branch))],batches=["All",...new Set(db.alumni.map(x=>x.batch).sort())];return '<div class="sectionhead"><div><h1>Alumni Directory</h1><p>Manage profiles and discover people across the community.</p></div><button class="btn primary" onclick="openAlumni()">＋ Add alumni</button></div><div class="stats" style="grid-template-columns:repeat(3,1fr)">'+stat("Total records",db.alumni.length,"♙","All profiles")+stat("Verified",db.alumni.filter(x=>x.status==="Verified").length,"✓","Status checked")+stat("Showing",a.length,"⌕","Matches current filters")+'</div><section class="card"><div class="toolbar"><input class="field search" id="q" placeholder="Search name, email, company, role or ID…" value="'+esc(filters.q)+'"><select class="field" id="branch">'+branches.map(x=>'<option '+(x===filters.branch?"selected":"")+'>'+esc(x)+'</option>').join("")+'</select><select class="field" id="batch">'+batches.map(x=>'<option '+(x===filters.batch?"selected":"")+'>'+esc(x)+'</option>').join("")+'</select><select class="field" id="status">'+["All","Verified","Pending"].map(x=>'<option '+(x===filters.status?"selected":"")+'>'+x+'</option>').join("")+'</select><button class="btn secondary" onclick="resetFilters()">Reset</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Alumni</th><th>Batch / Branch</th><th>Company / Role</th><th>Location</th><th>Status</th><th>Actions</th></tr></thead><tbody>'+a.map(x=>'<tr><td><div class="person"><div class="avatar">'+ini(x.name)+'</div><div><b>'+esc(x.name)+'</b><small>'+esc(x.email)+'</small></div></div></td><td>'+esc(x.batch)+'<br><span class="muted">'+esc(x.branch)+'</span></td><td><b>'+esc(x.company)+'</b><br><span class="muted">'+esc(x.role)+'</span></td><td>'+esc(x.city)+'</td><td><span class="status '+(x.status==="Pending"?"pending":"")+'">'+x.status+'</span></td><td><button class="mini" onclick="openAlumni('+x.id+')">Edit</button><button class="mini" onclick="delAlumni('+x.id+')">×</button></td></tr>').join("")||'<tr><td colspan="6" class="empty">No profiles match the filters.</td></tr>'+'</tbody></table></div><div class="sub" style="margin-top:12px">Showing '+a.length+' of '+db.alumni.length+' profiles · Saved locally in this browser.</div></section>'}
function eventsPage(){return '<div class="sectionhead"><div><h1>Events & Networking</h1><p>Organize community activities and keep event details together.</p></div><button class="btn primary" onclick="openEvent()">＋ Create event</button></div><div class="featuregrid">'+db.events.map(e=>{let d=new Date(e.date+"T12:00:00");return '<div class="feature"><div style="display:flex;justify-content:space-between"><div class="ico">▦</div><span class="tag '+(e.status==="Planning"?"blue":"")+'">'+e.status+'</span></div><h3>'+esc(e.title)+'</h3><p>'+esc(e.type)+' · '+esc(e.location)+'</p><div style="display:flex;justify-content:space-between;margin:15px 0;font-size:11px"><b>'+d.toLocaleDateString("en",{month:"short",day:"numeric",year:"numeric"})+'</b><span>'+e.attendees+' interested</span></div><button class="btn secondary" onclick="openEvent('+e.id+')">Edit</button> <button class="btn secondary" onclick="delEvent('+e.id+')">Delete</button></div>'}).join("")+'</div><div class="notice">Event changes are saved locally. Invitations and calendar integrations are not enabled in Phase 1.</div>'}
function mentorship(){let m=db.alumni.filter(x=>x.interest==="Mentorship");return '<div class="sectionhead"><div><h1>Mentorship & Connections</h1><p>Explore profiles marked as open to mentorship.</p></div></div><div class="stats" style="grid-template-columns:repeat(3,1fr)">'+stat("Potential mentors",m.length,"✦","Based on interest field")+stat("Branches",new Set(m.map(x=>x.branch)).size,"⌘","Represented in sample")+stat("Requests recorded",db.requests.length,"↔","Local demo requests")+'</div><div class="featuregrid">'+m.map(x=>'<div class="feature"><div class="person"><div class="avatar">'+ini(x.name)+'</div><div><b>'+esc(x.name)+'</b><small>'+esc(x.company)+' · '+esc(x.role)+'</small></div></div><p>'+esc(x.branch)+' · Batch '+esc(x.batch)+' · '+esc(x.city)+'</p><span class="tag">Open to mentorship</span><p><button class="btn secondary" onclick="requestMentor('+x.id+')">Request connection</button></p></div>').join("")+'</div><div class="notice">Connection requests are only recorded locally; no email or message is sent.</div><div style="margin-top:18px">'+card("Your requests","Recorded in this browser",db.requests.map(r=>'<div class="activityrow"><div class="ico">✦</div><div><b>'+esc(r.name)+'</b><small>Request date: '+esc(r.date)+'</small></div><span class="tag blue">Recorded</span></div>').join("")||'<div class="empty">No connection requests yet.</div>')+'</div>'}
function analytics(){let a=db.alumni,bs=[...new Set(a.map(x=>x.branch))];return '<div class="sectionhead"><div><h1>Community Analytics</h1><p>Summaries calculated from the current editable directory.</p></div><button class="btn secondary" onclick="exportCSV()">⇩ Export CSV</button></div><div class="stats">'+stat("Profiles",a.length,"♙","Current local data")+stat("Companies",new Set(a.map(x=>x.company)).size,"▦","Unique labels")+stat("Branches",bs.length,"⌘","Distinct branches")+stat("Mentorship",a.filter(x=>x.interest==="Mentorship").length,"✦","Interest marked")+'</div><div class="grid">'+card("Profiles by branch","Distribution of directory records",'<div class="activity">'+bs.map(b=>{let n=a.filter(x=>x.branch===b).length;return '<div><div style="display:flex;justify-content:space-between;font-size:12px"><b>'+esc(b)+'</b><span>'+n+' · '+Math.round(n/Math.max(1,a.length)*100)+'%</span></div><div class="meter"><span style="width:'+n/Math.max(1,a.length)*100+'%"></span></div></div>'}).join("")+'</div>')+card("Profile status","Verification state",'<div class="activity"><div><b>Verified</b> '+a.filter(x=>x.status==="Verified").length+'<div class="meter"><span style="width:'+a.filter(x=>x.status==="Verified").length/Math.max(1,a.length)*100+'%"></span></div></div><div><b>Pending</b> '+a.filter(x=>x.status==="Pending").length+'<div class="meter"><span style="width:'+a.filter(x=>x.status==="Pending").length/Math.max(1,a.length)*100+'%"></span></div></div></div>')+'</div><div class="notice">All figures are computed from editable fictional demo records, not actual institutional alumni data.</div>'}
function render(){let fn={dashboard,directory,events:eventsPage,mentorship,analytics};$("content").innerHTML=fn[page]();if(page==="directory"){let q=$("q");q.addEventListener("input",e=>{let v=e.target.value,p=e.target.selectionStart;filters.q=v;render();$("q").focus();$("q").setSelectionRange(p,p)});["branch","batch","status"].forEach(id=>$(id).addEventListener("change",e=>{filters[id]=e.target.value;render()}))}}
function resetFilters(){filters={q:"",branch:"All",batch:"All",status:"All"};render()}
function closeModal(){$("modalRoot").innerHTML=""}
function modal(title,body,savefn){$("modalRoot").innerHTML='<div class="modalback" id="back"><div class="modal"><div class="modalhead"><h2>'+title+'</h2><button class="btn secondary" onclick="closeModal()">×</button></div>'+body+'</div></div>';$("back").addEventListener("click",e=>{if(e.target.id==="back")closeModal()});$("saveModal").addEventListener("click",savefn)}
function openAlumni(id){let x=db.alumni.find(a=>a.id===id)||{name:"",email:"",batch:"2025",branch:"CSE (DS)",company:"",role:"",city:"Noida",status:"Pending",interest:"Networking"};let val=(key,opts)=>opts?'<select class="field" id="f_'+key+'">'+opts.map(v=>'<option '+(x[key]===v?"selected":"")+'>'+v+'</option>').join("")+'</select>':'<input class="field" id="f_'+key+'" value="'+esc(x[key])+'">';modal(id?"Edit alumni profile":"Add alumni profile",'<div class="formgrid"><div class="fg"><label>Full name *</label>'+val("name")+'</div><div class="fg"><label>Email *</label><input class="field" id="f_email" type="email" value="'+esc(x.email)+'"></div><div class="fg"><label>Graduation batch</label>'+val("batch")+'</div><div class="fg"><label>Branch</label>'+val("branch",["CSE","CSE (DS)","ECE","IT","ME","CE","Other"])+'</div><div class="fg"><label>Company</label>'+val("company")+'</div><div class="fg"><label>Current role</label>'+val("role")+'</div><div class="fg"><label>City</label>'+val("city")+'</div><div class="fg"><label>Status</label>'+val("status",["Verified","Pending"])+'</div><div class="fg full"><label>Community interest</label>'+val("interest",["Mentorship","Networking","Hiring","Learning"])+'</div></div><div class="modalfoot"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn primary" id="saveModal">Save profile</button></div>',()=>{let g=k=>$("f_"+k).value.trim(),name=g("name"),email=g("email");if(!name||!email)return toast("Name and email are required.");if(!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email))return toast("Enter a valid email.");let o={id:x.id||Date.now(),name,email,batch:g("batch"),branch:g("branch"),company:g("company"),role:g("role"),city:g("city"),status:g("status"),interest:g("interest")};if(x.id)db.alumni=db.alumni.map(a=>a.id===x.id?o:a);else db.alumni.push(o);save();closeModal();render();toast(x.id?"Profile updated.":"Alumni profile added.")})}
function delAlumni(id){let x=db.alumni.find(a=>a.id===id);if(x&&confirm("Delete "+x.name+"?")){db.alumni=db.alumni.filter(a=>a.id!==id);save();render();toast("Profile deleted.")}}
function openEvent(id){let x=db.events.find(e=>e.id===id)||{title:"",date:"2026-11-14",type:"Networking",location:"NIET Campus",attendees:0,status:"Planning"};modal(id?"Edit event":"Create event",'<div class="formgrid"><div class="fg full"><label>Event title *</label><input class="field" id="e_title" value="'+esc(x.title)+'"></div><div class="fg"><label>Date</label><input class="field" type="date" id="e_date" value="'+esc(x.date)+'"></div><div class="fg"><label>Type</label><select class="field" id="e_type">'+["Networking","Webinar","Mentorship","Career Fair","Reunion"].map(t=>'<option '+(x.type===t?"selected":"")+'>'+t+'</option>').join("")+'</select></div><div class="fg"><label>Location</label><input class="field" id="e_location" value="'+esc(x.location)+'"></div><div class="fg"><label>Interested attendees</label><input class="field" type="number" min="0" id="e_attendees" value="'+x.attendees+'"></div><div class="fg full"><label>Status</label><select class="field" id="e_status">'+["Open","Planning","Completed"].map(t=>'<option '+(x.status===t?"selected":"")+'>'+t+'</option>').join("")+'</select></div></div><div class="modalfoot"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn primary" id="saveModal">Save event</button></div>',()=>{let title=$("e_title").value.trim();if(!title)return toast("Event title is required.");let o={id:x.id||Date.now(),title,date:$("e_date").value,type:$("e_type").value,location:$("e_location").value,attendees:Number($("e_attendees").value)||0,status:$("e_status").value};if(x.id)db.events=db.events.map(e=>e.id===x.id?o:e);else db.events.push(o);save();closeModal();render();toast("Event saved.")})}
function delEvent(id){let x=db.events.find(e=>e.id===id);if(x&&confirm("Delete event "+x.title+"?")){db.events=db.events.filter(e=>e.id!==id);save();render();toast("Event deleted.")}}
function requestMentor(id){let x=db.alumni.find(a=>a.id===id);if(db.requests.some(r=>r.id===id))return toast("Request already recorded.");db.requests.push({id,name:x.name,date:new Date().toLocaleDateString()});save();render();toast("Demo request recorded.")}
function exportCSV(){let rows=[["Alumni_ID","Name","Email","Batch","Branch","Company","Role","City","Status","Interest"],...db.alumni.map(a=>[a.id,a.name,a.email,a.batch,a.branch,a.company,a.role,a.city,a.status,a.interest])];let csv=rows.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\\r\\n");let blob=new Blob([csv],{type:"text/csv;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="alumni-directory.csv";a.click();URL.revokeObjectURL(url);toast("CSV exported.")}
render();
</script></body></html>
